[tool.poetry]
name = "economic-event-detection"
version = "0.1.0"
description = "Backend API for detecting and summarizing economic events from Reddit and Twitter"
authors = ["Vadim Sevriuk <vadim.sevriuk@gmail.com>", "Samuel Koffler <>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.9"
# Web Framework
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
python-multipart = "^0.0.6"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"

# Database
sqlalchemy = "^2.0.23"
alembic = "^1.12.1"
psycopg2-binary = "^2.9.9"

# Social Media APIs
praw = "^7.7.1"
tweepy = "^4.14.0"

# NLP and ML
transformers = "^4.35.2"
torch = "^2.1.1"
sentence-transformers = "^2.2.2"
bertopic = "^0.16.0"
spacy = "^3.7.2"
gensim = "^4.3.2"
scikit-learn = "^1.3.2"
nltk = "^3.8.1"

# Text Processing
sumy = "^0.11.0"
bert-extractive-summarizer = "^0.10.1"

# Clustering
hdbscan = "^0.8.33"
umap-learn = "^0.5.5"

# Evaluation Metrics
rouge-score = "^0.1.2"
sacrebleu = "^2.3.1"
bert-score = "^0.3.13"

# Data Processing
pandas = "^2.1.3"
numpy = "^1.26.2"
python-dateutil = "^2.8.2"

# Task Scheduling
apscheduler = "^3.10.4"

# Environment Management
python-dotenv = "^1.0.0"

# Utilities
requests = "^2.31.0"
tqdm = "^4.66.1"
httpx = "^0.25.2"

# Web Scraping
selenium = "^4.26.1"
webdriver-manager = "^4.0.2"
openai = "^2.8.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
black = "^23.11.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
