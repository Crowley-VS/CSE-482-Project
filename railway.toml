[build]
builder = "DOCKERFILE"
dockerfilePath = "backend_prod/Dockerfile"
dockerContext = "backend_prod"
watchPatterns = ["backend_prod/**"]

[deploy]
startCommand = "python run.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 100

[build.env]
# Build-time environment variables can be added here if needed

[env]
# Runtime environment variables
# Railway will automatically provide these from the service settings:
# - DATABASE_URL (if Postgres is linked)
# - PORT (Railway assigns this automatically)
# 
# Additional required environment variables should be set in Railway dashboard:
# - DATABASE_URL
# - CORS_ORIGINS
# - Any other app-specific settings from app/core/config.py
